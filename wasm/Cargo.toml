[package]
name = "whisper-crypto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
chacha20poly1305 = "0.11"
argon2 = "0.5"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23"
serde_json = "1"
hex = "0.4"

console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
